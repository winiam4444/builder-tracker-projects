name: Validate projects.json

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate projects.json
        run: python3 scripts/validate_projects.py

  bot:
    name: Bot offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run bot offline tests
        env:
          LIVE: ""
        run: python -m unittest discover bot/tests
